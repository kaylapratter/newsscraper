name: Weekly News Pulse Scraper

on:
  schedule:
    - cron: '0 */3 * * *'  # Automatically runs every 3 hours
  workflow_dispatch:        # Allows manual triggering from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Scrapers & Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xidizxbsrwrkbgokxdnu.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_6KPjtxyVAcRWrXR3CA8fvg_1JIpQMjI' }}
        run: |
          python scraper.py
          python upload_to_supabase.py
